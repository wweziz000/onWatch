# Replace only .github/workflows/windows-build.yml from the previous helper kit.
# Other repository workflows are unchanged and may still run independently.
# Also add build-windows.ps1 at the repository root.
# No provider keys or personal account tokens are needed by this workflow.
name: Windows EXE (Build only)

'on':
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows EXE without tests
        shell: pwsh
        run: ./build-windows.ps1 -Architecture amd64
      - name: Upload only explicit build outputs
        uses: actions/upload-artifact@v4
        with:
          name: onwatch-windows-amd64-${{ github.sha }}
          path: |
            dist/onwatch-windows-amd64.exe
            dist/LICENSE
            dist/SHA256SUMS-windows-amd64.txt
            dist/build-info-windows-amd64.json
          if-no-files-found: error
          retention-days: 14
